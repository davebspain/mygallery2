
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Photo Gallery</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      color: #222;
    }

    header {
      background: #24292f;
      color: white;
      text-align: center;
      padding: 35px 20px;
    }

    header h1 {
      margin: 0 0 10px;
    }

    header p {
      margin: 0;
      color: #ddd;
    }

    .gallery {
      max-width: 1400px;
      margin: auto;
      padding: 24px;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 18px;
    }

    .photo {
      width: 100%;
      height: 240px;
      object-fit: cover;
      display: block;
      border-radius: 10px;
      cursor: pointer;
      background: #e0e0e0;
    }

    .photo:hover {
      opacity: 0.88;
    }

    .error {
      height: 240px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      background: #fff;
      color: #b42318;
      overflow-wrap: anywhere;
    }

    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(0, 0, 0, 0.92);
      align-items: center;
      justify-content: center;
      padding: 40px;
    }

    .lightbox.active {
      display: flex;
    }

    .lightbox img {
      max-width: 100%;
      max-height: 85vh;
      object-fit: contain;
    }

    .close {
      position: absolute;
      top: 12px;
      right: 24px;
      color: white;
      font-size: 42px;
      border: 0;
      background: transparent;
      cursor: pointer;
    }

    footer {
      padding: 20px;
      text-align: center;
      color: #666;
    }

    @media (max-width: 900px) {
      .gallery {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .photo,
      .error {
        height: 200px;
      }
    }

    @media (max-width: 600px) {
      .gallery {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        padding: 12px;
      }

      .photo,
      .error {
        height: 160px;
      }

      .lightbox {
        padding: 15px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>My Photo Gallery 2</h1>
    <p>My collection of 12 photos</p>
  </header>

  <main class="gallery" id="gallery"></main>

  <div
    class="lightbox"
    id="lightbox"
    role="dialog"
    aria-modal="true"
    aria-label="Enlarged photo"
    onclick="closeImage(event)"
  >
    <button
      class="close"
      aria-label="Close image"
      onclick="closeImage(event)"
    >&times;</button>

    <img id="largeImage" alt="Enlarged photo">
  </div>

  <footer>My Photo Gallery</footer>

  <script>
    const gallery = document.getElementById("gallery");

    for (let i = 1; i <= 12; i++) {
      const card = document.createElement("div");
      const img = document.createElement("img");

      // Images are in the SAME directory as index.html
     img.src = `photo${i}.JPG`;
      img.alt = `Photo ${i}`;
      img.className = "photo";
      img.loading = "eager";

      img.addEventListener("click", () => {
        document.getElementById("largeImage").src = img.src;
        document.getElementById("lightbox").classList.add("active");
      });

      img.onerror = () => {
        card.className = "error";
        card.textContent =
          card.textContent = `Photo ${i} could not load: ${img.src}`;
      };

      card.appendChild(img);
      gallery.appendChild(card);
    }

    function closeImage(event) {
      if (
        event.target.id === "lightbox" ||
        event.target.classList.contains("close")
      ) {
        document.getElementById("lightbox")
          .classList.remove("active");
      }
    }

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") {
        document.getElementById("lightbox")
          .classList.remove("active");
      }
    });
  </script>

</body>
</html>
